<style>
:root{--fir:#08251A;--lf:#ABFF44;--grass:#7DDD3D;--go:#3AB533;--white:#FFFFFF;--n3:#E4F0DA;--lblue:#91DBDA;--r-lg:32px;--r-md:24px;--pill:999px;
--h:"VC Nudge SemiNormal","Roboto Condensed",sans-serif;--b:"Die Grotesk B",Roboto,system-ui,sans-serif;--m:"Roboto Mono",ui-monospace,Menlo,monospace}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--n3);color:var(--fir);font-family:var(--b);font-size:15px;line-height:1.3;letter-spacing:0}
h1,h2,h3,h4,p,ul,ol,blockquote,pre{margin:0}
h1,h2,h3{font-family:var(--h);letter-spacing:0;line-height:1.06}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--fir);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{display:block}
strong{font-weight:700}
.cap{font-family:var(--m);font-size:.75rem;letter-spacing:.03em;line-height:1.25}
.eyebrow{font-weight:700;font-size:.75rem;text-transform:uppercase;line-height:1.15}
.pill{display:inline-block;border-radius:var(--pill);padding:.05rem .65rem;font-size:.75rem;font-weight:700;border:1px solid var(--fir);white-space:nowrap;line-height:1.5;background:var(--white)}
.pill.cur{background:var(--lf)}.pill.int{background:var(--white)}.pill.chk{background:var(--lblue)}.pill.rm{background:var(--fir);color:var(--lf)}
.pill.ok{background:var(--lf)}.pill.no{background:var(--fir);color:var(--lf)}
.pilltxt{font-size:.8125rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border-radius:var(--pill);border:1px solid var(--fir);padding:.5rem 1.05rem;font-weight:500;cursor:pointer;background:var(--white);line-height:1.15;text-decoration:none}
.btn.pri{background:var(--fir);color:var(--lf)}
.btn.acc{background:var(--lf);color:var(--fir)}
.btn.sm{padding:.3rem .8rem;font-size:.8125rem}
.btn:hover:not(:disabled){background:var(--lf);color:var(--fir)}
.btn.pri:hover:not(:disabled){background:var(--grass)}
.btn:disabled{background:var(--n3);border-style:dashed;cursor:not-allowed}
select,input[type=text],input[type=date],textarea{border:1px solid var(--fir);border-radius:var(--r-md);padding:.5rem .9rem;background:var(--white);width:100%}
textarea{resize:vertical;min-height:4.5rem}
select{width:auto;padding-right:2rem}
input:disabled,textarea:disabled,select:disabled{background:var(--n3);border-style:dashed}
input[type=checkbox],input[type=radio]{accent-color:var(--go);width:1rem;height:1rem;flex-shrink:0}
label.cb{display:flex;gap:.5rem;align-items:center;cursor:pointer}

/* top */
.top{background:var(--white);border-bottom:1px solid var(--fir);padding:.6rem 1.25rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.top .logo svg{height:38px;width:auto}
.top h1{font-weight:800;font-size:1.3rem}
.top .sp{flex:1}
.top .ctl{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.banner{background:var(--lf);border-bottom:1px solid var(--fir);padding:.45rem 1.25rem;display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}
.banner .cap{text-transform:uppercase}
.banner .legend{display:flex;gap:.35rem;flex-wrap:wrap;margin-left:auto}

/* layout */
.app{display:grid;grid-template-columns:250px minmax(0,1fr) 310px;gap:1rem;padding:1rem 1.25rem;max-width:1680px;margin:0 auto;align-items:start}
.card{background:var(--white);border:1px solid var(--fir);border-radius:var(--r-md);padding:1rem}
.rail{position:sticky;top:.75rem;display:flex;flex-direction:column;gap:.75rem;max-height:calc(100vh - 1.5rem);overflow:auto}
.stepbtn{display:flex;gap:.6rem;align-items:center;width:100%;text-align:left;border:1px solid var(--fir);border-radius:var(--r-md);background:var(--white);padding:.45rem .65rem;cursor:pointer}
.stepbtn+.stepbtn{margin-top:.4rem}
.stepbtn.on{background:var(--lf)}
.stepbtn:hover{background:var(--lf)}
.sico svg{width:26px;height:26px}
.stxt{display:flex;flex-direction:column;flex:1;min-width:0}
.snum{font-family:var(--m);font-size:.6875rem;letter-spacing:.03em}
.sname{font-weight:700;font-size:.875rem;line-height:1.15}
.sdone{width:20px;height:20px;border-radius:var(--pill);background:var(--lf);border:1px solid var(--fir);display:grid;place-items:center;flex-shrink:0}
.stepbtn.on .sdone{background:var(--white)}
.sdone svg{width:12px;height:12px}
.cv-list{list-style:none;padding:0;display:flex;flex-direction:column;gap:.3rem;margin-top:.5rem}
.cv{display:flex;gap:.5rem;align-items:center;font-size:.8125rem;line-height:1.2}
.cv i{width:16px;height:16px;border-radius:var(--pill);border:1px solid var(--fir);background:var(--white);flex-shrink:0;display:grid;place-items:center}
.cv.ok i{background:var(--lf)}
.cv i svg{width:10px;height:10px;visibility:hidden}
.cv.ok i svg{visibility:visible}
.cv.flash{font-weight:700}
.cv .ex{font-family:var(--m);font-size:.6875rem}
.metrics{display:grid;grid-template-columns:1fr;gap:.4rem;margin-top:.5rem}
.mt{border:1px solid var(--fir);border-radius:var(--r-md);padding:.4rem .7rem;background:var(--n3)}
.mt b{display:block;font-family:var(--h);font-weight:800;font-size:1.15rem;line-height:1.05}
.mt span{font-size:.75rem}

.stage{background:var(--white);border:1px solid var(--fir);border-radius:var(--r-lg);padding:1.25rem;min-width:0}
.stage-head{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start;flex-wrap:wrap;margin-bottom:1rem}
.stage-head h2{font-weight:800;font-size:1.9rem;margin-top:.15rem}
.stage-head .labels{display:flex;gap:.3rem;flex-wrap:wrap}
.panel{border:1px solid var(--fir);border-radius:var(--r-md);padding:1rem;background:var(--white);min-width:0}
.panel.tint{background:var(--n3)}
.panel.blue{background:var(--lblue)}
.panel-h{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-bottom:.6rem}
.panel+.panel{margin-top:.9rem}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.9rem;align-items:start}
.grid2.w{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr)}
.stack{display:flex;flex-direction:column;gap:.9rem}
.note{font-size:.8125rem;line-height:1.3}
.mt1{margin-top:.5rem}.mt2{margin-top:1rem}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.empty{text-align:center;padding:2.5rem 1rem}
.empty h3{font-weight:800;font-size:1.4rem;margin-bottom:.4rem}
.empty .row{justify-content:center;margin-top:1rem}

.notes h3{font-weight:800;font-size:1.25rem;margin:.15rem 0}
.notes h4{font-size:.75rem;text-transform:uppercase;margin:.9rem 0 .25rem;font-weight:700}
.notes blockquote{border-left:4px solid var(--lf);padding-left:.6rem;font-size:.875rem}
.notes p{font-size:.875rem}
.notes .tip{margin-top:1rem}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--fir);border-radius:var(--r-md)}
.tbl{width:100%;border-collapse:collapse;font-size:.8125rem;text-align:left}
.tbl th{background:var(--fir);color:var(--white);font-weight:700;padding:.5rem .7rem;vertical-align:bottom}
.tbl td{padding:.5rem .7rem;vertical-align:top}
.tbl tbody tr:nth-child(even) td{background:var(--n3)}
.tbl tr.hl td{background:var(--lf)!important}
.tbl tr[data-act]{cursor:pointer}
.tbl tr[data-act]:hover td{background:var(--lblue)!important}
code,pre{font-family:var(--m);font-size:.75rem}
pre{background:var(--fir);color:var(--white);border-radius:var(--r-md);padding:.8rem 1rem;overflow:auto;line-height:1.4;white-space:pre-wrap;word-break:break-word}
pre .k{color:var(--lf)}

/* site frame */
.frame{border:1px solid var(--fir);border-radius:var(--r-md);overflow:hidden;background:var(--white)}
.frame-bar{display:flex;gap:.6rem;align-items:center;padding:.4rem .7rem;background:var(--n3);border-bottom:1px solid var(--fir)}
.url{font-family:var(--m);font-size:.75rem;background:var(--white);border:1px solid var(--fir);border-radius:var(--pill);padding:.1rem .7rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.site-head{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;padding:.65rem 1rem;border-bottom:1px solid var(--fir)}
.wm{font-family:var(--h);font-weight:800;font-size:1.15rem;border:1px dashed var(--fir);border-radius:var(--r-md);padding:.1rem .8rem}
.site-head nav{font-size:.8125rem;display:flex;gap:1rem;flex-wrap:wrap}
.site-hero{padding:1rem 1rem .25rem}
.site-hero h2{font-weight:800;font-size:1.6rem}
.site-cols{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:1rem;padding:1rem}
.site-foot{border-top:1px solid var(--fir);padding:.7rem 1rem;background:var(--n3);font-size:.75rem}
.res{list-style:none;padding:0;display:flex;flex-direction:column;gap:.4rem;margin-top:.5rem}
.res button{width:100%;text-align:left;border:1px solid var(--fir);border-radius:var(--r-md);background:var(--white);padding:.45rem .8rem;cursor:pointer;display:flex;gap:.5rem;justify-content:space-between;align-items:center}
.res button:hover{background:var(--lf)}
.assist{border:1px solid var(--fir);border-radius:var(--r-md);background:var(--n3);padding:.8rem;display:flex;flex-direction:column;gap:.6rem}
.assist-head{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.assist-state{display:flex;gap:.5rem;align-items:center;font-size:.8125rem}
.chat{background:var(--white);border:1px solid var(--fir);border-radius:var(--r-md);padding:.7rem;min-height:260px;max-height:430px;overflow:auto;display:flex;flex-direction:column;gap:.6rem}
.msg{max-width:94%;border-radius:var(--r-md);padding:.55rem .85rem;font-size:.875rem}
.msg.user{align-self:flex-end;background:var(--fir);color:var(--white)}
.msg.bot{align-self:flex-start;background:var(--n3);border:1px solid var(--fir)}
.ans-badge{font-family:var(--m);font-size:.6875rem;text-transform:uppercase;letter-spacing:.03em;margin-bottom:.3rem}
.ans-short{font-weight:500}
.ans-state{background:var(--lf);border:1px solid var(--fir);border-radius:var(--r-md);padding:.4rem .7rem;margin:.5rem 0;font-size:.8125rem}
.ans-detail{font-size:.8125rem;margin-top:.4rem}
.ans-src{font-size:.75rem;margin-top:.5rem;border-top:1px solid var(--fir);padding-top:.4rem}
.ans-next{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.5rem}
.chips{display:flex;gap:.35rem;flex-wrap:wrap}
.chipq{border:1px solid var(--fir);border-radius:var(--pill);background:var(--white);padding:.25rem .75rem;font-size:.8125rem;cursor:pointer}
.chipq:hover{background:var(--lf)}
.chipq small{font-family:var(--m);font-size:.6875rem;margin-left:.3rem}
.ask{display:flex;gap:.4rem}
.prov{border:1px solid var(--fir);border-radius:var(--r-md);padding:.5rem .8rem;background:var(--white);margin-top:.9rem}
.prov summary{cursor:pointer;font-weight:700;font-size:.875rem}
.prov .ent{border-top:1px solid var(--fir);margin-top:.5rem;padding-top:.5rem;font-size:.8125rem}

/* form */
.fld{display:flex;flex-direction:column;gap:.2rem;margin-bottom:.7rem}
.fld>label,.fld>.lbl{font-weight:700;font-size:.8125rem}
.fld .ref{font-family:var(--m);font-size:.6875rem;letter-spacing:.03em;font-weight:400}
.fld .err{font-size:.75rem;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.tabs{display:flex;gap:.35rem;margin-bottom:.6rem;flex-wrap:wrap}
.tab{border:1px solid var(--fir);border-radius:var(--pill);background:var(--white);padding:.25rem .85rem;cursor:pointer;font-size:.8125rem}
.tab.on{background:var(--fir);color:var(--lf)}
.valid{border:1px solid var(--fir);border-radius:var(--r-md);padding:.6rem .8rem;font-size:.8125rem;background:var(--n3)}
.valid ul{padding-left:1.1rem;margin-top:.3rem}

/* builder */
.dev{display:flex;gap:.35rem}
.canvaswrap{background:var(--n3);border:1px solid var(--fir);border-radius:var(--r-md);padding:.8rem;display:flex;justify-content:center}
.page{background:var(--white);border:1px solid var(--fir);border-radius:var(--r-md);overflow:hidden;width:100%;transition:width .2s}
.page.tablet{width:560px;max-width:100%}.page.mobile{width:340px;max-width:100%}
.blk{position:relative;border-bottom:1px dashed var(--fir);padding:.8rem 1rem}
.blk.locked{background:var(--n3)}
.blk-tools{display:flex;gap:.3rem;align-items:center;margin-bottom:.4rem;flex-wrap:wrap}
.lockico{font-family:var(--m);font-size:.6875rem;border:1px solid var(--fir);border-radius:var(--pill);padding:0 .5rem;background:var(--white)}
.p-hero h1{font-weight:800;font-size:1.5rem}
.p-img{margin-top:.5rem;border:1px solid var(--fir);border-radius:var(--r-md);background:var(--lblue);height:90px;display:grid;place-items:center;font-size:.75rem;text-align:center;padding:.3rem}
.p-ans h2,.p-facts h2{font-weight:800;font-size:1.05rem;margin:.2rem 0}
.p-facts li{margin:.2rem 0;font-size:.875rem}
.libr{display:flex;flex-direction:column;gap:.4rem}
.libr .item{border:1px solid var(--fir);border-radius:var(--r-md);padding:.45rem .7rem;display:flex;justify-content:space-between;gap:.5rem;align-items:center}
.libr .item small{display:block;font-size:.75rem}
.gate{display:flex;gap:.5rem;align-items:flex-start;padding:.35rem 0;border-bottom:1px solid var(--n3);font-size:.8125rem}
.gate .pill{flex-shrink:0}

/* workflow */
.wf{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:.8rem}
.wfs{flex:1;min-width:110px;border:1px solid var(--fir);border-radius:var(--pill);padding:.35rem .8rem;text-align:center;font-size:.8125rem;background:var(--white)}
.wfs.on{background:var(--lf);font-weight:700}
.wfs.past{background:var(--n3)}
.persona{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.8rem}
.persona button{display:flex;gap:.5rem;align-items:center;border:1px solid var(--fir);border-radius:var(--pill);background:var(--white);padding:.25rem .8rem .25rem .3rem;cursor:pointer}
.persona button.on{background:var(--fir);color:var(--lf)}
.persona i{width:26px;height:26px;border-radius:var(--pill);background:var(--lf);color:var(--fir);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:.75rem;border:1px solid var(--fir)}
ins{background:var(--lf);text-decoration:none}
del{background:var(--lblue);text-decoration:line-through}
.diffbox{border:1px solid var(--fir);border-radius:var(--r-md);padding:.6rem .8rem;font-size:.8125rem;background:var(--white)}
.diffbox+.diffbox{margin-top:.5rem}
.diffbox h4{font-size:.6875rem;text-transform:uppercase;margin-bottom:.2rem}

/* pipeline */
.pipe{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.5rem}
.node{border:1px solid var(--fir);border-radius:var(--r-md);padding:.6rem;background:var(--white);font-size:.8125rem;min-height:110px}
.node.done{background:var(--lf)}
.node.run{background:var(--lblue)}
.node b{display:block;font-size:.875rem;margin-bottom:.2rem}
.node .pill{margin-top:.35rem}
.bars .b{display:flex;gap:.5rem;align-items:center;font-size:.8125rem;margin:.25rem 0}
.bars .b span.l{width:60px;flex-shrink:0}
.bars .b span.t{flex:1;background:var(--n3);border:1px solid var(--fir);border-radius:var(--pill);height:16px;overflow:hidden}
.bars .b span.t i{display:block;height:100%;background:var(--lf);border-right:1px solid var(--fir);transition:width .6s}
.kp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.5rem}
.kp>div{border:1px solid var(--fir);border-radius:var(--r-md);padding:.6rem .8rem;background:var(--n3)}
.kp b{font-family:var(--h);font-weight:800;font-size:1.5rem;display:block;line-height:1.05}
.kp span{font-size:.75rem}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--fir);color:var(--white);border-radius:var(--pill);padding:.5rem 1.1rem;font-size:.875rem;z-index:50;max-width:92vw}
.toast[hidden]{display:none}

@media (max-width:1180px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;max-height:none}
  .rail .steps{display:flex;gap:.4rem;overflow-x:auto}
  .rail .steps .stepbtn{width:auto;min-width:170px;margin:0}
  .site-cols,.grid2,.grid2.w{grid-template-columns:1fr}
  .pipe{grid-template-columns:1fr 1fr}
  .kp{grid-template-columns:1fr 1fr}
}
@media (max-width:560px){.two{grid-template-columns:1fr}.top h1{font-size:1.05rem}}

/* guidance, step nav, narrow-pane order */
.help{background:var(--white);border:1px solid var(--fir);border-radius:var(--r-lg);padding:1rem 1.25rem;margin:1rem auto 0;width:calc(100% - 2.5rem);max-width:1640px}
.help:empty{display:none}
.help h2{font-size:1.5rem;margin:.1rem 0 .6rem}
.help ol{margin:0 0 .9rem;padding-left:1.3rem;display:grid;gap:.4rem;line-height:1.3}
.help .hrow{display:flex;gap:.5rem;flex-wrap:wrap}
.tryit{margin-top:1rem;background:var(--lblue);border:1px solid var(--fir);border-radius:var(--r-md);padding:.7rem 1rem}
.tryit p{margin-top:.2rem;line-height:1.3}
.stepnav{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-top:1rem;flex-wrap:wrap}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.stage{scroll-margin-top:.5rem}
@media (min-width:900px){.top{position:sticky;top:0;z-index:20}}
@media (max-width:1180px){
  .app{display:flex;flex-direction:column;align-items:stretch}
  .app>*{min-width:0}
  .rail .card{min-width:0}
  .rail{display:contents}
  .rail>.card:nth-child(1){order:1}
  .stage{order:2}
  .rail>.card:nth-child(2){order:3}
  .rail>.card:nth-child(3){order:4}
  .notes{order:5}
}
@media print{.top .ctl,.rail,.notes{display:none}}

/* ---------- retrieval simulation ---------- */
function stem(w){
  if(SYN[w])return SYN[w];
  if(w.length>5&&/ing$/.test(w))w=w.slice(0,-3);
  else if(w.length>4&&/ed$/.test(w))w=w.slice(0,-2);
  else if(w.length>3&&/s$/.test(w)&&!/ss$/.test(w))w=w.slice(0,-1);
  return SYN[w]||w;
}
function toks(s){
  var out=[];String(s||'').toLowerCase().replace(/['\u2019]/g,'').replace(/[^a-z0-9\s-]/g,' ').replace(/-/g,' ').split(/\s+/).forEach(function(w){
    if(!w||STOP[w])return; var st=stem(w); if(st&&!STOP[st]&&out.indexOf(st)<0)out.push(st);
  }); return out;
}
function retrieve(q){
  var qt=toks(q), ranked=S.index.map(function(doc){
    var tt=toks(doc.title),kt=toks(doc.keywords),bt=toks([doc.short,doc.detail,doc.summary].join(' '));
    var sum=0; qt.forEach(function(t){ sum+= tt.indexOf(t)>=0?3: kt.indexOf(t)>=0?2: bt.indexOf(t)>=0?1:0 });
    return {doc:doc,score:qt.length?sum/(3*qt.length):0};
  }).sort(function(a,b){return b.score-a.score});
  var best=ranked[0]; var band=!best||best.score<T_LOW?'none':best.score<T_ANSWER?'low':'answer';
  return {tokens:qt,ranked:ranked,best:best,band:band};
}

  if(!d.detail||d.detail.trim().length<20)L('detail','Supporting detail is required');
  if(!d.summary||d.summary.trim().length<15)L('summary','Plain-language summary is required (1.1.3)');
  if(!d.owner||!d.owner.trim())L('owner','Accountable owner is required (1.1.3)');
  if(!d.source||!d.source.trim())L('source','Authoritative source is required (1.1.3)');
  if(!d.effective)L('effective','Effective date is required (1.1.3)');

  if(d.stateScope==='specific'&&!STATES.some(function(s){return (d.stateNotes[s]||'').trim()}))L('state','Add wording for at least one state');

}

function diffHTML(a,b){
  var A=String(a||'').split(/(\s+)/).filter(function(x){return x!==''}),B=String(b||'').split(/(\s+)/).filter(function(x){return x!==''});
  var n=A.length,m=B.length,dp=[],i,j;for(i=0;i<=n;i++){dp.push(new Array(m+1).fill(0))}
  for(i=n-1;i>=0;i--)for(j=m-1;j>=0;j--)dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  var out='';i=0;j=0;
  while(i<n&&j<m){if(A[i]===B[j]){out+=esc(A[i]);i++;j++}else if(dp[i+1][j]>=dp[i][j+1]){out+='<del>'+esc(A[i])+'</del>';i++}else{out+='<ins>'+esc(B[j])+'</ins>';j++}}
  while(i<n){out+='<del>'+esc(A[i++])+'</del>'}while(j<m){out+='<ins>'+esc(B[j++])+'</ins>'}
  return out;
}

  return '<div class="card"><p class="eyebrow">Steps</p><div class="steps mt1">'+steps+'</div></div><div class="card"><p class="eyebrow">Liberty\u2019s \u201cexplicitly demonstrate\u201d list</p><p class="note">'+cnt+' of 10 shown</p><ul class="cv-list">'+cv+'</ul></div>'+
   '<div class="card"><p class="eyebrow">Their success metrics</p><div class="metrics"><div class="mt"><b>'+tm+'</b><span>Time to publish</span></div><div class="mt"><b>'+(S.biz?'100%':'n/a')+'</b><span>Changes without engineering</span></div><div class="mt"><b>'+(S.live?'1 \u2192 '+n:'n/a')+'</b><span>Reuse (item to consumers)</span></div></div></div>';

var TRY={

   (n<9?'<button class="btn acc" data-act="next">Next: '+esc(nx.title)+'</button>':'<button class="btn acc" data-act="reset">Start over</button>')+'</div>';
}

function helpHTML(){
  return '<p class="eyebrow">Start here</p><h2>What to do</h2><ol>'+
   '<li><strong>Watch it run.</strong> Press Play the whole flow. All nine steps run on their own in about '+PLAYMIN+'. Press Stop to pause.</li>'+

   '<label class="sr" for="pace">Pace</label><select id="pace" data-ch="pace"><option value="2"'+(PACE===2?' selected':'')+'>Presenter pace (about 1 min)</option><option value="1"'+(PACE===1?' selected':'')+'>Quick (about 30 sec)</option></select>'+
   '<label class="sr" for="jump">Jump to a step</label><select id="jump" data-ch="jump"><option value="">Jump to step (resets)</option>'+STEPS.map(function(s){return '<option value="'+s.n+'">'+s.n+'. '+esc(s.title)+'</option>'}).join('')+'</select>'+
   '<button class="btn" data-act="showhelp">How to use</button><button class="btn" data-act="reset">Reset</button>';
}
function refreshChrome(){var r=$('#rail');if(r){r.innerHTML=railHTML();var sc=$('.steps',r),on=sc&&$('.stepbtn.on',sc);if(sc&&on&&sc.scrollWidth>sc.clientWidth+4){sc.scrollLeft=on.getBoundingClientRect().left-sc.getBoundingClientRect().left+sc.scrollLeft-12}}var h=$('#help');if(h)h.innerHTML=S.helpHidden?'':helpHTML();var n=$('#notes');if(n)n.innerHTML=notesHTML();var c=$('#ctl');if(c){var f=document.activeElement;if(!(f&&c.contains(f)&&f.tagName==='SELECT'))c.innerHTML=ctlHTML()}}
function render(){
  var st=$('#stage'); if(!st)return;
  st.innerHTML=SCENES[S.step]()+navHTML(); refreshChrome();
  if(S.step===1){var c=$('#chat');if(c)c.scrollTop=c.scrollHeight}
  if(S.step===8&&S.analytics&&S.analytics.fresh){animate()}
}
function animate(){
  var A=S.analytics;A.fresh=false;var els=$$('[data-count]'),i=0;
  var iv=setInterval(function(){i++;els.forEach(function(el){el.textContent=Math.round(+el.dataset.count*Math.min(1,i/14)).toLocaleString()});if(i>=14)clearInterval(iv)},40);
}
function goStep(n){S.step=Math.max(1,Math.min(9,n)); if(S.step>1)S.helpHidden=true; if(S.step===9)mark('roadmap'); if(S.step===4)S.builder.mode=S.builder.mode; render(); var w=window.innerWidth<1180;if(w&&$('#stage'))$('#stage').scrollIntoView({block:'start'})}
var toastT=null;
function toast(m){var t=$('#toast');if(!t)return;t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},FAST?50:2600)}

/* ---------- scripted flow ---------- */
var SCRIPT=[
 {step:1,run:async function(ok){ask('What is a deductible?');await sleep(1100);if(!ok())return;ask('What are no-fault insurance states?');await sleep(1100);if(!ok())return;ask('Can I insure my drone?');await sleep(800)}},
 {step:2,run:async function(ok){S.sel='g1';render();await sleep(900);if(!ok())return;createDraft(GAPS[0]);mark('profound');render();await sleep(700)}},
 {step:3,run:async function(ok){fillDemo();render();await sleep(900);if(!ok())return;S.draft.geo=true;render();await sleep(600);if(!ok())return;saveDraft();render();await sleep(700)}},
 {step:4,run:async function(ok){assemble();render();await sleep(900);if(!ok())return;S.builder.mode='preview';S.builder.previewed=true;afterBuild();render();await sleep(900)}},
 {step:5,run:async function(ok){
   if(!submitReview())return; render();await sleep(800);if(!ok())return;
   S.role='legal';render();await sleep(700);if(!ok())return;legalRequest('Soften the absolute wording and note the limits.');render();await sleep(900);if(!ok())return;
   S.role='author';S.draft.short=S.draft.short.replace('your own auto policy pays for','your own auto policy may pay for').replace('no matter who caused it','regardless of who was at fault, up to your coverage limits');saveDraft();submitReview();render();await sleep(900);if(!ok())return;
   S.role='legal';legalApprove('Wording approved.');render();await sleep(800);if(!ok())return;
   S.role='publisher';publish();render();await sleep(900);}},
 {step:6,run:async function(ok){await pipeChain;if(!ok())return;render();await sleep(900)}},
 {step:7,run:async function(ok){S.gql.q='fault';runQuery();render();await sleep(1100)}},
 {step:8,run:async function(ok){simTraffic();render();await sleep(1500)}},
 {step:9,run:async function(ok){await sleep(900)}}
];
var playTok=0;
async function play(){
  var my=++playTok;S.playing=true;S.helpHidden=true;refreshChrome();var ok=function(){return my===playTok};
  for(var i=0;i<SCRIPT.length;i++){if(!ok())return;goStep(SCRIPT[i].step);await sleep(700);if(!ok())return;await SCRIPT[i].run(ok);await sleep(600)}
  if(ok()){S.playing=false;refreshChrome()}
}
function stop(){playTok++;S.playing=false;refreshChrome()}
function reset(silent){playTok++;S=fresh();pipeChain=Promise.resolve();if(!silent)render();else{}}
async function ffTo(n){playTok++;reset(true);FAST=true;for(var i=0;i<SCRIPT.length;i++){if(SCRIPT[i].step>=n)break;await SCRIPT[i].run(function(){return true})}await pipeChain;FAST=false;goStep(n);}

/* ---------- events ---------- */
var ACT={
 prev:function(){goStep(S.step-1)},
 next:function(){goStep(S.step+1)},
 start:function(){S.helpHidden=true;refreshChrome();var s=$('#stage');if(s)s.scrollIntoView({block:'start'})},
 hidehelp:function(){S.helpHidden=true;refreshChrome()},
 showhelp:function(){S.helpHidden=false;refreshChrome();window.scrollTo(0,0)},
 go:function(t){goStep(+t.dataset.n)},
 q:function(t){ if(S.step!==1){goStep(1)} ask(t.dataset.q)},
 pickstate:function(t){pickState(t.dataset.v)},
 cta:function(t){var v=t.dataset.v;S.cta++;toast(v==='quote'?'Illustrative: this would open the quote flow.':v==='agent'?'Illustrative: this would open the agent finder.':'Illustrative: this would hand off to a person with the conversation attached.')},
 pickgap:function(t){S.sel=t.dataset.id;render()},
 mkdraft:function(){var g=GAPS.filter(function(x){return x.id===S.sel})[0];if(g&&g.cited!=='Yes'){createDraft(g);mark('profound');render();toast('Draft created in CMS as a draft, not live.')}},
 blank:function(){createDraft(null);render()},
 filldemo:function(){fillDemo();render()},
 aisuggest:function(){aiSuggest();render()},
 save:function(){var ch=saveDraft();render();toast(ch?'Saved as v'+S.draft.version+'.':'No changes to save.')},
 geo:function(){if(S.draft){S.draft.geo=true;S.s3tab='jsonld';audit('Mark (GEO Schema agent)','automation','Schema refined','Properties added to the JSON-LD. Review before publishing.');render()}},
 s3tab:function(t){S.s3tab=t.dataset.v;rerender('#s3right',s3right());$$('.tab',$('#s3right')).forEach(function(x){})},
 addblock:function(t){var k=t.dataset.t;if(!BLOCKS[k].ok){toast('Not allowed on resource pages. The library only offers approved components.');return}if(S.builder.blocks.indexOf(k)<0)S.builder.blocks.push(k);afterBuild();render()},
 mv:function(t){var i=+t.dataset.i,d=+t.dataset.d,b=S.builder.blocks,j=i+d;if(j<0||j>=b.length)return;var x=b[i];b[i]=b[j];b[j]=x;afterBuild();render()},
 rm:function(t){S.builder.blocks.splice(+t.dataset.i,1);afterBuild();render()},
 mode:function(t){S.builder.mode=t.dataset.v;if(t.dataset.v==='preview')S.builder.previewed=true;afterBuild();render()},
 device:function(t){S.builder.device=t.dataset.v;S.builder.previewed=true;afterBuild();render()},
 assemble:function(){assemble();render()},
 role:function(t){setRole(t.dataset.v)},
 submit:function(){if(submitReview()){render();toast('Sent to Legal.')}},
 approve:function(){if(legalApprove(S.comment)){S.comment='';render();toast('Approved.')}},
 reqchange:function(){if(!S.comment.trim()){toast('Add a comment so the author knows what to change.');return}if(legalRequest(S.comment)){S.comment='';render();toast('Sent back to the author.')}},
 selfapprove:function(){selfApprove();render()},
 publish:function(){if(publish()){render();toast('Published. The pipeline has started.')}},
 rollback:function(t){if(rollback(+t.dataset.v)){render();toast('Rolled back. The index will update.')}},
 replay:function(){startPipe()},
 askagain:function(){goStep(1);ask(S.draft?S.draft.title:'What are no-fault insurance states?')},
 runq:function(){runQuery();render()},
 pick7:function(t){S.sel7=t.dataset.id;render()},
 surf:function(t){S.surf=t.dataset.v;render()},
 traffic:function(){simTraffic();render()},
 cyc:function(t){var r=S.ai[+t.dataset.i],o=['cur','int','chk','rm'];r.k=o[(o.indexOf(r.k)+1)%4];mark('roadmap');render()},
 play:function(){S.playing?stop():play()},
 reset:function(){reset();toast('Simulation reset.')}
};
function rerender(sel,html){var el=$(sel);if(el)el.innerHTML=html}
var INP={
 f:function(t){S.draft[t.dataset.f]=t.value;rerender('#s3valid',valHTML());var r=$('#s3right');if(r)r.innerHTML=s3right()},
 snote:function(t){S.draft.stateNotes[t.dataset.st]=t.value;rerender('#s3valid',valHTML());var r=$('#s3right');if(r)r.innerHTML=s3right()},
 alt:function(t){S.builder.alt=t.value;rerender('#s4gates',gatesHTML(gates()));var p=$('#s4prev');if(p)p.innerHTML=pageHTML(S.builder.mode==='edit');afterBuild();refreshChrome()},
 comment:function(t){S.comment=t.value},
 gq:function(t){S.gql.q=t.value}
};
var CHG={
 ustate:function(t){pickState(t.value)},
 fsel:function(t){S.draft[t.dataset.f]=t.value;rerender('#s3valid',valHTML());var r=$('#s3right');if(r)r.innerHTML=s3right()},
 scope:function(t){S.draft.stateScope=t.value;rerender('#statenotes',stateNotesHTML());rerender('#s3valid',valHTML())},
 aud:function(t){var a=S.draft.audience,v=t.dataset.v,i=a.indexOf(v);if(t.checked&&i<0)a.push(v);if(!t.checked&&i>=0)a.splice(i,1);rerender('#s3valid',valHTML())},
 va:function(t){S.vA=t.value;render()},vb:function(t){S.vB=t.value;render()},
 gf:function(t){S.gql[t.dataset.f]=t.value;render()},

};
document.addEventListener('click',function(e){var t=e.target.closest('[data-act]');if(!t||t.disabled)return;var fn=ACT[t.dataset.act];if(fn)fn(t,e)});
document.addEventListener('input',function(e){var t=e.target.closest('[data-in]');if(t&&INP[t.dataset.in])INP[t.dataset.in](t,e)});
document.addEventListener('change',function(e){var t=e.target.closest('[data-ch]');if(t&&CHG[t.dataset.ch])CHG[t.dataset.ch](t,e)});
document.addEventListener('submit',function(e){var f=e.target.closest('[data-form="ask"]');if(!f)return;e.preventDefault();var i=$('#askq');if(i){var v=i.value;i.value='';ask(v);i.focus()}});
document.addEventListener('keydown',function(e){
  var tg=e.target,tag=tg&&tg.tagName; if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return;
  if(e.key==='ArrowRight'){goStep(S.step+1)}else if(e.key==='ArrowLeft'){goStep(S.step-1)}
  else if((e.key==='Enter'||e.key===' ')&&tg&&tg.matches&&tg.matches('tr[data-act]')){e.preventDefault();tg.click()}
});
window.onerror=function(m){window.__errs=(window.__errs||[]);window.__errs.push(String(m))};

/* ---------- self-test (?selftest=1) ---------- */
async function selftest(){
  var R=[],ok=function(n,c){R.push((c?'PASS ':'FAIL ')+n)};
  try{
    reset(true);
    ok('gap not answerable before publish',retrieve('What are no-fault insurance states?').band==='none');
    ok('deductible answers',retrieve('What is a deductible?').band==='answer');
    ok('pet question is low confidence',retrieve('Does insurance cover my pet\u2019s vet bills?').band==='low');
    ok('drone has no answer',retrieve('Can I insure my drone?').band==='none');
    ok('deductible needs no state',!needsState(retrieve('What is a deductible?').best.doc));
    // manual governance checks
    createDraft(null);fillDemo();saveDraft();
    ok('draft valid after demo fill',validate(S.draft).length===0);
    ok('review blocked before page is built',S.role==='author'&&submitReview()===false);
    assemble();S.builder.previewed=true;afterBuild();
    ok('gates pass after assemble',gatesOK());
    ok('submit works',submitReview()&&S.status==='review');
    selfApprove();ok('self-approval blocked and logged',S.status==='review'&&S.audit[S.audit.length-1].action.indexOf('Blocked')===0);
    S.role='legal';ok('legal cannot request change without comment',legalRequest('')===false);
    ok('legal request works',legalRequest('Soften wording')&&S.status==='changes');
    // full flow
    await ffTo(9);
    var d=findDoc('ci-004');
    ok('published item is in the index',!!d&&d.version>=2);
    ok('versions recorded (>=2)',S.versions.length>=2);
    ok('post-publish answer',retrieve('What are no-fault insurance states?').band==='answer');
    ok('post-publish needs state',needsState(retrieve('What are no-fault insurance states?').best.doc));
    ask('What are no-fault insurance states?');ok('clarifying question when state unset',S.chat[S.chat.length-1].kind==='clarify');
    pickState('MA');ok('state answer shows MA wording',botHTML(S.chat[S.chat.length-1]).indexOf('Massachusetts')>=0);
    var tot=COVER.length,got=COVER.filter(function(c){return S.done[c.k]}).length;
    ok('all coverage items demonstrated ('+got+'/'+tot+')',got===tot);
    ok('analytics produced',!!S.analytics);
    ok('graph result has the new item',S.gqlRes&&S.gqlRes.items.some(function(x){return x.id==='ci-004'}));
    ok('time to publish recorded',!!(S.timer.start&&S.timer.end));
    var before=findDoc('ci-004').short;S.role='publisher';ok('rollback ok',rollback(1));await pipeChain;
    ok('rollback changed the live answer',findDoc('ci-004').short!==before&&findDoc('ci-004').version===S.versions.length);
    ok('gaps closed',gaps().every(function(g){return g.q==='What is the 80% rule for home insurance?'||g.q==='Can I insure my drone?'||!!g.closed}));
    for(var n=1;n<=9;n++){goStep(n);ok('scene '+n+' renders',$('#stage').innerHTML.length>300)}
    goStep(1);ACT.next();ok('next moves to step 2',S.step===2);ACT.prev();ok('back moves to step 1',S.step===1);ok('every step has a try tip',STEPS.every(function(s){return !!TRY[s.n]}));
    ok('no runtime errors',!(window.__errs&&window.__errs.length));
  }catch(err){R.push('FAIL exception: '+err.message+' '+(err.stack||'').split('\n')[1])}
  var pre=$('#selftest');pre.hidden=false;pre.textContent=R.join('\n');document.title='SELFTEST '+(R.every(function(x){return x.indexOf('PASS')===0})?'OK':'FAILED');
}
window.__sim={S:function(){return S},ffTo:ffTo,ask:ask,goStep:goStep};

render();
if(/[?&]selftest=1/.test(location.search))selftest();
})();
