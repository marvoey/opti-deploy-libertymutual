name: Deploy
on:
  push:
    branches: [main]

jobs:
  # Two jobs, so the build's scripts never hold the right to ask GitHub for a proof.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: |
            dist
            !**/.git/**
          include-hidden-files: true
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - name: Prove this run to the portal
        run: |
          PROOF=$(curl --fail -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://deploy.optimizely.com" | jq -r .value)
          REPLY=$(curl --fail-with-body -sS -X POST https://deploy.optimizely.com/api/deployments/github-oidc -H "Authorization: Bearer $PROOF" -H 'content-type: application/json' -d '{"owner":"marvin-oey","slug":"liberty-mutual"}') || { echo "$REPLY" >&2; exit 1; }
          TOKEN=$(echo "$REPLY" | jq -r .access_token)
          echo "::add-mask::$TOKEN"
          echo "OPTI_DEPLOY_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Deploy to Optimizely Deploy Portal
        run: |
          #!/usr/bin/env bash
          # ⚠️ Fail on the first error, not at the end: a PUT that silently fails turns into a
          # confusing 409 from finalize ("declared 1200 bytes, arrived 0") three steps later.
          set -euo pipefail

          # Portable on both GitHub's ubuntu-latest and a Mac: `find -printf` and `stat -c` are
          # GNU-only, `wc -c` and one of the two sha tools are everywhere.
          sha() { command -v sha256sum >/dev/null 2>&1 && sha256sum "$1" | cut -d' ' -f1 || shasum -a 256 "$1" | cut -d' ' -f1; }

          # 1. Describe what you are about to upload. No files are sent yet.
          cd 'site'
          # jq builds the JSON, not printf: a filename containing a quote or backslash would produce
          # an invalid manifest, and with set -e that now dies as a jq parse error naming nothing.
          find . -type f ! -path './.git/*' ! -path './.github/*' ! -path './node_modules/*' | sed 's|^\./||' | while read -r f; do
            jq -Rn --arg p "$f" --argjson s "$(wc -c < "$f" | tr -d ' ')" --arg h "$(sha "$f")" \
              '{path:$p, size:$s, sha256:$h}'
          done | jq -s --arg n 'liberty-mutual' --arg o 'marvin-oey' '{name:$n, owner:$o, manifest:.}' > /tmp/begin.json

          BEGIN=$(curl --fail-with-body -sS -X POST "https://deploy.optimizely.com/api/deployments/upload/begin" \
            -H "Authorization: Bearer $OPTI_DEPLOY_TOKEN" \
            -H 'content-type: application/json' --data-binary @/tmp/begin.json) || {
            # ⚠️ Print the refusal: a failed $(…) keeps the body in BEGIN, and set -e would exit silently.
            echo "$BEGIN" >&2; exit 1; }
          UPLOAD_ID=$(echo "$BEGIN" | jq -r '.upload_id')
          # ⭐ THE CREDENTIAL FOR THE REST OF THIS UPLOAD, and the reason the token above may be a
          # single-use one. It is good for finalize and abort of THIS upload only, and dies with it —
          # so the long-lived key is presented once, not three times, and never reaches the trap.
          CONT=$(echo "$BEGIN" | jq -r '.continuation')

          # Give the slot back on the way out, however we leave.
          # ⚠️ INT and TERM as well as ERR: a cancelled or timed-out CI job dies by signal, which does
          # not fire an ERR trap — and that is exactly the job this is here for.
          trap 'curl -sS -X DELETE "https://deploy.optimizely.com/api/deployments/upload/abort?upload_id=$UPLOAD_ID" \
            -H "Authorization: Bearer $CONT" >/dev/null || true' ERR INT TERM

          # 2. Send each file to the URL minted for it. These do not touch the portal.
          #    -T streams the file; 8 at a time, because one at a time is slow for a big build.
          # ⚠️ NUL-separated, because xargs splits on SPACES as well as tabs — a path with a space in
          # it would mis-pair, and a file would be PUT to the wrong URL rather than failing cleanly.
          echo "$BEGIN" | jq -j '.uploads[] | .path + "\u0000" + .url + "\u0000"' |
            xargs -0 -P 8 -n 2 sh -c 'curl --fail-with-body -sS -T "$0" -H "x-ms-blob-type: BlockBlob" "$1"'

          # 3. Publish. The portal now checks what actually arrived, scans it, and commits.
          curl --fail-with-body -sS -X POST "https://deploy.optimizely.com/api/deployments/upload/finalize" \
            -H "Authorization: Bearer $CONT" -H 'content-type: application/json' \
            -d "{\"upload_id\": \"$UPLOAD_ID\"}"
